<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Wire</title>
<meta name="description" content="Daily AI headlines from trusted sources.">
<meta name="theme-color" content="#fbfcfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#19202a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap">
<style>
/* Layout: classic feed reader. Toolbar, headline list on the left, reading pane on the right; one pane at a time on phones. */
:root{
  --bg:#eef1f4; --pane:#fbfcfd; --line:#d5dbe2; --fg:#16202b; --muted:#5d6b7a;
  --accent:#d9631e; --sel:#e3e9f0; --read:#7b8795;
  --ui:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace; --serif:"Newsreader",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12171d; --pane:#19202a; --line:#2c3642; --fg:#e6ebf1; --muted:#97a4b3;
  --accent:#f08a4b; --sel:#232d39; --read:#7d8998; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.5;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--pane)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px}
.brand svg{width:18px;height:18px;flex:none}
.stamp{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto}
.refresh{border:1px solid var(--line);background:transparent;border-radius:3px;padding:2px 10px;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--pane);scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:3px;padding:3px 10px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--pane);border-color:var(--fg)}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,420px) 1fr}
.list{overflow-y:auto;border-right:1px solid var(--line);background:var(--pane);min-width:0}
.day{position:sticky;top:0;background:var(--bg);font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:5px 16px;border-bottom:1px solid var(--line)}
.item{display:grid;grid-template-columns:10px 1fr;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 16px}
.item:hover{background:var(--sel)}
.item[aria-current="true"]{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px}
.item.read .dot{background:transparent;border:1px solid var(--line)}
.item .t{font-weight:600;line-height:1.35;text-wrap:pretty}
.item.read .t{font-weight:400;color:var(--read)}
.item .m{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:3px}
.reader{overflow-y:auto;min-width:0;padding:32px 16px 48px}
.article{max-width:64ch;margin:0 auto}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.article h1{font-family:var(--serif);font-weight:600;font-size:clamp(26px,3.4vw,36px);line-height:1.15;margin:10px 0 12px;text-wrap:balance}
.byline{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-bottom:16px;border-bottom:1px solid var(--line)}
.body{font-family:var(--serif);font-size:19px;line-height:1.6;margin:20px 0 28px}
.open{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;padding:10px 16px;border-radius:3px}
.note{font-size:13px;color:var(--muted);margin-top:14px}
.back{display:none;border:0;background:transparent;color:var(--accent);font-weight:600;padding:0;margin-bottom:20px}
.empty{color:var(--muted);padding:40px 16px;text-align:center;max-width:44ch;margin:0 auto}
.keys{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:28px}
kbd{font-family:var(--mono);border:1px solid var(--line);border-radius:3px;padding:0 5px;background:var(--pane)}
@media (max-width:760px){
  .main{grid-template-columns:1fr}
  .list{border-right:0}
  .main.reading .list{display:none}
  .main:not(.reading) .reader{display:none}
  .back{display:inline-block}
  .keys{display:none}
  .reader{padding-top:20px}
}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="19" r="3" fill="var(--accent)"/><path d="M2 10a12 12 0 0 1 12 12M2 3a19 19 0 0 1 19 19" fill="none" stroke="var(--accent)" stroke-width="3.2" stroke-linecap="round"/></svg>
    AI Wire
  </div>
  <span id="count" class="stamp"></span>
  <button class="refresh" id="refresh" type="button">Refresh</button>
</header>
<nav class="chips" id="chips" aria-label="Filter headlines"></nav>

<div class="main" id="main">
  <div class="list" id="list" aria-label="Headlines">
    <p class="empty">Loading headlines…</p>
  </div>
  <div class="reader" id="reader">
    <p class="empty" id="readerEmpty">Pick a headline to read the story.</p>
    <article class="article" id="article" hidden>
      <button class="back" id="back" type="button">← Headlines</button>
      <div class="kicker" id="aSource"></div>
      <h1 id="aTitle"></h1>
      <div class="byline" id="aBy"></div>
      <p class="body" id="aBody"></p>
      <a class="open" id="aLink" target="_blank" rel="noopener">Read the full story</a>
      <p class="note">This is the publisher's own excerpt. The button opens the complete article on their site.</p>
      <p class="keys"><kbd>J</kbd> next · <kbd>K</kbd> previous · <kbd>O</kbd> open full story</p>
    </article>
  </div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var stories=[], filter="All", current=null, updated="";
  var read={};
  try{read=JSON.parse(localStorage.getItem("aiwire.read")||"{}")||{}}catch(e){}
  function saveRead(){
    var live={}; stories.forEach(function(s){if(read[s.id])live[s.id]=1});   // forget stories that have aged out
    try{localStorage.setItem("aiwire.read",JSON.stringify(live))}catch(e){}
  }
  function dayKey(iso){var d=new Date(iso);return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()}
  function dayLabel(iso){
    var dt=new Date(iso), today=new Date(), y=new Date(); y.setDate(today.getDate()-1);
    if(dt.toDateString()===today.toDateString()) return "Today";
    if(dt.toDateString()===y.toDateString()) return "Yesterday";
    return dt.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
  }
  function clock(iso){return new Date(iso).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})}
  function visible(){
    return stories.filter(function(s){
      if(filter==="All") return true;
      if(filter==="Unread") return !read[s.id];
      return s.source===filter;
    });
  }
  function renderChips(){
    var sources=[]; stories.forEach(function(s){if(sources.indexOf(s.source)<0)sources.push(s.source)});
    sources.sort();
    if(["All","Unread"].concat(sources).indexOf(filter)<0) filter="All";
    var box=$("chips"); box.textContent="";
    ["All","Unread"].concat(sources).forEach(function(name){
      var b=document.createElement("button"); b.type="button"; b.className="chip"; b.textContent=name;
      b.setAttribute("aria-pressed",String(name===filter));
      b.onclick=function(){filter=name;renderChips();renderList()};
      box.appendChild(b);
    });
  }
  function message(msg){var box=$("list"); box.textContent=""; var p=document.createElement("p"); p.className="empty"; p.textContent=msg; box.appendChild(p)}
  function renderList(){
    var box=$("list"), items=visible(), top=box.scrollTop;
    var unread=stories.filter(function(s){return !read[s.id]}).length;
    $("count").textContent=stories.length? unread+" unread"+(updated?" · updated "+updated:"") : "";
    if(!items.length){ message(stories.length? "Nothing here. You have read everything in this view." : "No headlines yet. Tap Refresh in a little while."); return }
    box.textContent="";
    var last=null;
    items.forEach(function(s){
      var k=dayKey(s.date);
      if(k!==last){last=k;var h=document.createElement("div");h.className="day";h.textContent=dayLabel(s.date);box.appendChild(h)}
      var b=document.createElement("button"); b.type="button"; b.className="item"+(read[s.id]?" read":"");
      if(current===s.id) b.setAttribute("aria-current","true");
      var dot=document.createElement("span"); dot.className="dot";
      var w=document.createElement("span");
      var t=document.createElement("div"); t.className="t"; t.textContent=s.title;
      var m=document.createElement("div"); m.className="m"; m.textContent=s.source+" · "+clock(s.date);
      w.appendChild(t); w.appendChild(m); b.appendChild(dot); b.appendChild(w);
      b.onclick=function(){openStory(s.id)};
      box.appendChild(b);
    });
    box.scrollTop=top;
  }
  function openStory(id){
    var s=stories.filter(function(x){return x.id===id})[0]; if(!s) return;
    current=id; read[id]=1; saveRead();
    $("readerEmpty").hidden=true; $("article").hidden=false;
    $("aSource").textContent=s.source;
    $("aTitle").textContent=s.title;
    $("aBy").textContent=dayLabel(s.date)+" · "+clock(s.date);
    $("aBody").textContent=s.summary||"The publisher's feed gave no excerpt for this story.";
    var a=$("aLink"); a.href=s.url; a.textContent="Read the full story at "+s.source+" ↗";
    $("main").classList.add("reading"); $("reader").scrollTop=0;
    if(history.state!=="story") history.pushState("story","");
    renderList();
    var cur=$("list").querySelector('[aria-current="true"]'); if(cur) cur.scrollIntoView({block:"nearest"});
  }
  function closeStory(){$("main").classList.remove("reading")}
  $("back").onclick=function(){ if(history.state==="story") history.back(); else closeStory() };
  window.addEventListener("popstate",closeStory);          // Android back button returns to the list
  document.addEventListener("keydown",function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    var k=e.key.toLowerCase(), items=visible();
    if(k==="j"||k==="k"){
      var i=items.map(function(s){return s.id}).indexOf(current);
      var n=k==="j"? Math.min(items.length-1,i+1) : Math.max(0,i-1);
      if(items[n]) openStory(items[n].id);
    }else if(k==="o"&&current){ $("aLink").click() }
  });

  function load(){
    $("refresh").disabled=true;
    fetch("data/stories.json?t="+Date.now()).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json() }).then(function(d){
      stories=(d.stories||[]).filter(function(s){return s&&s.title&&/^https:\/\//.test(s.url||"")&&!isNaN(new Date(s.date))});
      var t=new Date(d.updatedAt);
      updated=isNaN(t)?"":t.toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
      renderChips(); renderList();
    }).catch(function(){
      if(!stories.length) message("The headlines could not be loaded. Check your connection and tap Refresh.");
    }).then(function(){ $("refresh").disabled=false });
  }
  $("refresh").onclick=load;
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) load() });
  load();
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
</html>
