<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Wire</title>
<meta name="description" content="Daily AI headlines from trusted sources.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Vazirmatn:wght@400;600&display=swap">
<script>
(function(){var t=null;try{t=localStorage.getItem("aiwire.theme")}catch(e){}
var dark=t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
if(dark)document.documentElement.classList.add("dark");
var a=null;try{a=JSON.parse(localStorage.getItem("aiwire.accent"))}catch(e){}
if(typeof a==="string"&&/^[a-z]+$/.test(a))document.documentElement.dataset.accent=a})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
